# Free scheduling for the crypto bot using GitHub Actions cron.
#
# WHY THIS WORKS WITHOUT PAYING FOR A HOST
# The bot's `--once` mode runs a single cycle and exits. It reconciles against
# Alpaca at the start of every run and treats the broker as the source of truth,
# so it does not need a persistent disk or a long-lived process.
#
# READ THIS BEFORE RELYING ON IT
#   * GitHub cron is BEST EFFORT and it is NOT a reliable 15-minute timer.
#     The `*/15` slot is the single most oversubscribed schedule on the whole
#     platform, so GitHub silently DROPS most of those runs under load. In
#     practice the old config was delivering roughly one run every 2 hours.
#
#     The fix is "internal batching": the schedule asks for a run every 10
#     minutes and each delivered run executes 2 cycles at 5-minute intervals,
#     covering the 10-minute window. Asking for 10-minute slots is much more
#     reliable than 15-minute ones (less contention), and the fewer cycles per
#     run keep runtime under the timeout.
#
#     This is still NOT a guarantee. If a run is dropped, nothing is watching
#     your stop-losses until the next one lands. For punctual monitoring you
#     need an always-on host (VPS/systemd), not cron-on-Actions.
#
#   * Public repos get unlimited free Actions minutes. Private repos get 2,000
#     minutes/month and a 10-min schedule would exceed it.
#   * Scheduled workflows are auto-DISABLED after 60 days of repository
#     inactivity. GitHub emails you; re-enable it in the Actions tab.
#   * This is fine for PAPER trading. Do not trust it with real money.

name: Crypto Bot Cycle

on:
  schedule:
    # Every 10 minutes. Two cycles at 5-minute intervals give full in-run
    # coverage. 10-minute slots are less contested than 15 or 30, so delivery
    # rate should be better.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: crypto-bot-cycle
  cancel-in-progress: false

permissions:
  contents: read

env:
  CYCLES_PER_RUN: "2"
  CYCLE_INTERVAL: "300"

jobs:
  cycle:
    runs-on: ubuntu-latest
    # 2 cycles × 300s + ~2 min setup = ~12 min, round up generously
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "::group::pip install (attempt $attempt)"
            if pip install --disable-pip-version-check -r requirements.txt; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "pip install failed on attempt $attempt; retrying in 15s"
            sleep 15
          done
          echo "pip install failed after 3 attempts"
          exit 1

      - name: Restore position state
        uses: actions/cache/restore@v4
        with:
          path: positions.json
          key: positions-${{ github.run_id }}
          restore-keys: |
            positions-

      - name: Run trading cycles
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          WATCHLIST: "BTC/USD,ETH/USD,SOL/USD"
          MAX_POSITIONS: "2"
          MAX_TOTAL_EXPOSURE_PCT: "0.20"
          MIN_NOTIONAL_USD: "10"
          LOG_LEVEL: "INFO"
        run: |
          python -u main.py \
            --cycles "${CYCLES_PER_RUN}" \
            --interval "${CYCLE_INTERVAL}"

      - name: Save position state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: positions.json
          key: positions-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-bot-log-${{ github.run_id }}
          path: crypto_bot.log
          retention-days: 7
          if-no-files-found: ignore
